<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TypeFlow — Typing Speed Test</title>

<style>
/* ============================================================
   1. DESIGN TOKENS — dull, soft, Fluent / Cupertino 3D surface
   ============================================================ */
:root{
  --bg1:#eef1f7;
  --bg2:#e4e9f2;
  --bg3:#dbe1ec;

  --ink:#2c3546;
  --ink2:#5d6979;
  --ink3:#8d99ac;
  --ink4:#aab4c4;

  --accent:#5b7cfa;
  --accent2:#8098ff;
  --accent-soft:rgba(91,124,250,.14);

  --good:#37a07a;
  --bad:#d1665f;

  --line:rgba(150,168,196,.28);

  --raise:
     inset 0 1px 0 rgba(255,255,255,.95),
     inset 0 -1px 0 rgba(160,175,200,.18),
     0 10px 26px rgba(140,157,185,.18),
     0 2px 6px rgba(140,157,185,.12);

  --soft:
     inset 0 1px 0 rgba(255,255,255,.9),
     0 4px 14px rgba(140,157,185,.14);

  --press:
     inset 0 2px 4px rgba(140,157,185,.28),
     inset 0 1px 0 rgba(255,255,255,.5),
     0 1px 2px rgba(140,157,185,.16);

  --r-xl:28px;
  --r-lg:20px;
  --r-md:14px;
  --r-sm:10px;

  --ease:cubic-bezier(.4,0,.2,1);
  --bounce:cubic-bezier(.34,1.5,.64,1);

  --lh:46px;              /* typing line height */
  --caret-h:26px;
}

*{margin:0;padding:0;box-sizing:border-box;}

html,body{height:100%;}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display",
              "Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink);
  background:
     radial-gradient(1200px 700px at 10% -12%, #f7f9fd 0%, transparent 60%),
     radial-gradient(900px 620px at 104% 8%, #e9eefb 0%, transparent 55%),
     linear-gradient(168deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
  background-attachment:fixed;
  min-height:100%;
  overflow-x:hidden;
  position:relative;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* ============================================================
   2. AMBIENT BACKGROUND — floating keywords + soft orbs
   ============================================================ */
.float-layer{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
  pointer-events:none;
}

.orb{
  position:absolute;
  border-radius:50%;
  filter:blur(52px);
  opacity:.55;
  will-change:transform;
  animation:orbDrift ease-in-out infinite alternate;
}
@keyframes orbDrift{
  from{ transform:translate3d(0,0,0) scale(1); }
  to  { transform:translate3d(48px,-56px,0) scale(1.16); }
}

.float-word{
  position:absolute;
  font-weight:700;
  letter-spacing:-.02em;
  color:rgba(108,132,178,.13);
  white-space:nowrap;
  user-select:none;
  will-change:transform,opacity;
  animation:floatUp linear infinite;
}
@keyframes floatUp{
  0%   { transform:translate3d(0,32px,0) rotate(var(--rot,0deg)) scale(.95); opacity:0; }
  12%  { opacity:1; }
  86%  { opacity:1; }
  100% { transform:translate3d(var(--drift,0px),-170px,0) rotate(var(--rot,0deg)) scale(1.03); opacity:0; }
}

/* ---- FREEZE THE AMBIENCE WHILE TYPING ---- */
body.typing .float-word,
body.typing .orb{
  animation-play-state:paused !important;
}

/* ============================================================
   3. APP SHELL
   ============================================================ */
.app{
  position:relative;
  z-index:1;
  max-width:1020px;
  margin:0 auto;
  padding:26px 20px 72px;
  display:flex;
  flex-direction:column;
  gap:18px;
}

/* ---------------- top bar ---------------- */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:14px 20px;
  border-radius:var(--r-xl);
  background:linear-gradient(180deg,rgba(255,255,255,.88),rgba(255,255,255,.62));
  border:1px solid rgba(255,255,255,.92);
  box-shadow:var(--raise);
  backdrop-filter:blur(22px) saturate(150%);
  -webkit-backdrop-filter:blur(22px) saturate(150%);
  animation:slideDown .7s var(--ease) both;
}
@keyframes slideDown{
  from{opacity:0;transform:translateY(-18px);}
  to  {opacity:1;transform:translateY(0);}
}

.brand{display:flex;align-items:center;gap:13px;}

.logo{
  width:46px;height:46px;
  display:grid;place-items:center;
  font-size:22px;
  border-radius:14px;
  background:linear-gradient(160deg,#ffffff,#e6ebf5);
  box-shadow:
     inset 0 2px 0 rgba(255,255,255,.95),
     inset 0 -2px 5px rgba(150,168,196,.22),
     0 8px 18px rgba(140,157,185,.28);
  transform:perspective(600px) rotateX(10deg);
  transition:transform .45s var(--bounce);
}
.logo:hover{transform:perspective(600px) rotateX(0deg) translateY(-2px);}

.brand h1{
  font-size:19px;
  font-weight:750;
  letter-spacing:-.02em;
  line-height:1.1;
}
.brand p{
  font-size:11.5px;
  color:var(--ink3);
  letter-spacing:.03em;
  margin-top:3px;
}

.best-badge{
  font-size:12.5px;
  font-weight:650;
  letter-spacing:.02em;
  color:var(--ink2);
  padding:9px 16px;
  border-radius:999px;
  background:linear-gradient(180deg,#fdfefe,#e9eef6);
  border:1px solid rgba(255,255,255,.92);
  box-shadow:var(--soft);
  white-space:nowrap;
}
.best-badge b{color:var(--accent);}

/* ---------------- ad slots ---------------- */
.ad-slot{
  position:relative;
  display:grid;
  place-items:center;
  border-radius:var(--r-lg);
  border:1px dashed rgba(150,168,196,.45);
  background:
     repeating-linear-gradient(135deg,
        rgba(255,255,255,.52) 0 12px,
        rgba(244,247,252,.52) 12px 24px);
  color:var(--ink4);
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.18em;
  text-transform:uppercase;
  overflow:hidden;
  transition:border-color .3s var(--ease);
}
.ad-slot:hover{border-color:rgba(91,124,250,.5);}
.ad-top{height:92px;}
.ad-mid{height:92px;}
.ad-res{height:74px;margin-top:8px;}

.ad-slot::after{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 22%,rgba(255,255,255,.78) 50%,transparent 78%);
  transform:translateX(-130%);
  animation:adShine 6.5s ease-in-out infinite;
}
@keyframes adShine{
  0%,68%{transform:translateX(-130%);}
  100%  {transform:translateX(130%);}
}

/* ---------------- main card ---------------- */
.card{
  padding:24px 26px 28px;
  border-radius:var(--r-xl);
  background:linear-gradient(180deg,rgba(255,255,255,.86),rgba(255,255,255,.6));
  border:1px solid rgba(255,255,255,.92);
  box-shadow:var(--raise);
  backdrop-filter:blur(24px) saturate(150%);
  -webkit-backdrop-filter:blur(24px) saturate(150%);
  animation:cardIn .8s .08s var(--ease) both;
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(22px) scale(.985);}
  to  {opacity:1;transform:translateY(0) scale(1);}
}

/* ---------------- controls ---------------- */
.controls{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.times{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  padding:6px;
  border-radius:999px;
  background:linear-gradient(180deg,#e7ecf4,#f2f5fa);
  box-shadow:var(--press);
}

.time-btn{
  border:0;
  cursor:pointer;
  font-family:inherit;
  font-size:12.5px;
  font-weight:650;
  letter-spacing:.02em;
  color:var(--ink2);
  padding:9px 16px;
  border-radius:999px;
  background:transparent;
  transition:all .25s var(--ease);
}
.time-btn:hover{color:var(--ink);}

.time-btn.active{
  color:#fff;
  background:linear-gradient(180deg,var(--accent2),var(--accent));
  box-shadow:
     inset 0 1px 0 rgba(255,255,255,.5),
     0 4px 12px rgba(91,124,250,.4),
     0 1px 2px rgba(91,124,250,.35);
  transform:translateY(-1px);
}

.btn{
  font-family:inherit;
  font-size:12.5px;
  font-weight:650;
  letter-spacing:.02em;
  border:1px solid rgba(255,255,255,.9);
  cursor:pointer;
  padding:10px 20px;
  border-radius:12px;
  background:linear-gradient(180deg,#ffffff,#e9eef6);
  color:var(--ink2);
  box-shadow:var(--soft);
  transition:all .22s var(--ease);
}
.btn:hover{transform:translateY(-1px);color:var(--ink);box-shadow:0 6px 18px rgba(140,157,185,.22);}
.btn:active{transform:translateY(1px);box-shadow:var(--press);}

.btn.primary{
  color:#fff;
  border-color:transparent;
  background:linear-gradient(180deg,var(--accent2),var(--accent));
  box-shadow:
     inset 0 1px 0 rgba(255,255,255,.45),
     0 6px 18px rgba(91,124,250,.4);
}
.btn.primary:hover{box-shadow:0 10px 24px rgba(91,124,250,.5);}

/* ---------------- stats ---------------- */
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:16px;
}

.stat{
  padding:13px 12px;
  border-radius:var(--r-md);
  text-align:center;
  background:linear-gradient(180deg,#fdfefe,#eef2f8);
  box-shadow:
     inset 0 1px 0 rgba(255,255,255,.95),
     inset 0 -2px 5px rgba(150,168,196,.13),
     0 5px 14px rgba(140,157,185,.14);
  transition:transform .3s var(--ease);
}
.stat:hover{transform:translateY(-2px);}

.stat .label{
  display:block;
  font-size:9.5px;
  font-weight:750;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--ink4);
  margin-bottom:5px;
}
.stat .value{
  display:block;
  font-size:23px;
  font-weight:750;
  letter-spacing:-.03em;
  color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.stat .value.pulse{animation:valPulse .36s var(--bounce);}
@keyframes valPulse{
  0%  {transform:scale(1);}
  45% {transform:scale(1.17);color:var(--accent);}
  100%{transform:scale(1);}
}

/* ---------------- progress ---------------- */
.progress{
  height:7px;
  border-radius:99px;
  background:linear-gradient(180deg,#e3e9f2,#eef2f8);
  box-shadow:inset 0 1px 3px rgba(150,168,196,.3);
  overflow:hidden;
  margin-bottom:20px;
}
.progress .bar{
  height:100%;
  width:100%;
  border-radius:99px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  box-shadow:0 0 12px rgba(91,124,250,.55);
  transition:width .15s linear, background .3s;
}
.progress .bar.low{
  background:linear-gradient(90deg,#d9776f,#e8a05f);
  box-shadow:0 0 12px rgba(217,119,111,.55);
}

/* ---------------- typing viewport ---------------- */
.viewport{
  position:relative;
  height:calc(var(--lh) * 3 + 26px);
  padding:13px 16px;
  border-radius:var(--r-md);
  overflow:hidden;
  background:linear-gradient(180deg,#f7f9fc,#eef2f8);
  box-shadow:
     inset 0 1px 0 rgba(255,255,255,.9),
     inset 0 3px 10px rgba(150,168,196,.2),
     0 1px 2px rgba(150,168,196,.12);
  cursor:text;
  user-select:none;
}

.text-inner{
  position:relative;
  font-size:21px;
  line-height:var(--lh);
  letter-spacing:.1px;
  font-weight:450;
  color:var(--ink4);
  transition:transform .2s var(--ease);
  will-change:transform;
}

.word{
  display:inline-block;
  vertical-align:top;
  white-space:pre;
}

.ch{
  border-radius:3px;
  transition:color .09s linear, background-color .09s linear;
}
.ch.correct{color:#2b3547;}
.ch.wrong{
  color:var(--bad);
  background:rgba(212,101,95,.14);
  box-shadow:inset 0 1px 0 rgba(212,101,95,.32);
}

.caret{
  position:absolute;
  top:0;left:0;
  width:2.5px;
  height:var(--caret-h);
  border-radius:3px;
  background:linear-gradient(180deg,var(--accent2),var(--accent));
  box-shadow:0 0 10px rgba(91,124,250,.75), 0 0 2px rgba(91,124,250,.9);
  transition:transform .09s linear, opacity .2s;
  animation:caretBlink 1.1s steps(1,end) infinite;
  pointer-events:none;
  will-change:transform;
}
@keyframes caretBlink{
  0%,49%  {opacity:1;}
  50%,100%{opacity:.12;}
}
body.typing .caret{animation:none;opacity:1;}

.hint{
  margin-top:14px;
  text-align:center;
  font-size:12px;
  letter-spacing:.06em;
  color:var(--ink4);
  transition:opacity .4s var(--ease);
}

/* ---------------- animated keyboard ---------------- */
.keyboard{
  padding:16px;
  border-radius:var(--r-xl);
  background:linear-gradient(180deg,rgba(255,255,255,.84),rgba(255,255,255,.56));
  border:1px solid rgba(255,255,255,.92);
  box-shadow:var(--raise);
  backdrop-filter:blur(22px) saturate(150%);
  -webkit-backdrop-filter:blur(22px) saturate(150%);
  animation:cardIn .8s .16s var(--ease) both;
  perspective:1500px;
}

.kb-row{
  display:flex;
  gap:6px;
  margin-bottom:6px;
}
.kb-row:last-child{margin-bottom:0;}

.key{
  flex:1 1 0;
  min-width:0;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:650;
  letter-spacing:.03em;
  color:var(--ink2);
  border-radius:9px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  user-select:none;
  background:linear-gradient(180deg,#ffffff 0%,#eaeff7 100%);
  box-shadow:
     inset 0 1px 0 rgba(255,255,255,1),
     inset 0 -2px 3px rgba(150,168,196,.22),
     0 3px 0 rgba(186,199,220,.55),
     0 5px 10px rgba(140,157,185,.22);
  transition:transform .09s var(--ease),
             box-shadow .09s var(--ease),
             background .18s var(--ease),
             color .18s var(--ease);
  will-change:transform;
}
.key.mod{color:var(--ink3);font-size:10px;}

.key.active{
  transform:translateY(3px);
  color:var(--accent);
  background:linear-gradient(180deg,#e8edfb,#f7f9ff);
  box-shadow:
     inset 0 1px 4px rgba(120,140,175,.35),
     0 0 0 1px rgba(91,124,250,.38),
     0 0 16px rgba(91,124,250,.38);
}

/* ============================================================
   4. RESULT OVERLAY / ANIMATED SCOREBOARD
   ============================================================ */
.overlay{
  position:fixed;
  inset:0;
  z-index:60;
  display:grid;
  place-items:center;
  padding:22px;
  background:rgba(226,232,242,.74);
  backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  opacity:0;
  visibility:hidden;
  transition:opacity .35s var(--ease), visibility .35s;
}
.overlay.show{opacity:1;visibility:visible;}

.result-card{
  width:min(580px,100%);
  max-height:92vh;
  overflow-y:auto;
  padding:30px 30px 24px;
  border-radius:30px;
  background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(248,250,254,.92));
  border:1px solid rgba(255,255,255,.96);
  box-shadow:
     inset 0 1px 0 rgba(255,255,255,1),
     0 30px 70px rgba(120,140,175,.32),
     0 8px 24px rgba(120,140,175,.18);
  transform:scale(.9) translateY(24px);
  opacity:0;
  transition:transform .5s var(--bounce), opacity .4s var(--ease);
}
.overlay.show .result-card{transform:scale(1) translateY(0);opacity:1;}

.res-head{
  text-align:center;
  font-size:10.5px;
  font-weight:750;
  letter-spacing:.24em;
  text-transform:uppercase;
  color:var(--ink4);
  margin-bottom:8px;
}

.big-stat{text-align:center;margin:4px 0 22px;}

.big-value{
  font-size:80px;
  font-weight:800;
  line-height:1;
  letter-spacing:-.05em;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(160deg,#4a68e0,#7f9bff 55%,#a3b6ff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  filter:drop-shadow(0 6px 16px rgba(91,124,250,.28));
}
.big-label{
  font-size:10.5px;
  font-weight:750;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--ink4);
  margin-top:9px;
}

.res-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin-bottom:20px;
}
.res-grid > div{
  padding:12px 8px;
  border-radius:14px;
  text-align:center;
  background:linear-gradient(180deg,#fdfefe,#eef2f8);
  box-shadow:
     inset 0 1px 0 rgba(255,255,255,.95),
     inset 0 -2px 5px rgba(150,168,196,.13),
     0 4px 12px rgba(140,157,185,.12);
  animation:popIn .5s var(--bounce) both;
}
.res-grid > div:nth-child(1){animation-delay:.14s;}
.res-grid > div:nth-child(2){animation-delay:.23s;}
.res-grid > div:nth-child(3){animation-delay:.32s;}
.res-grid > div:nth-child(4){animation-delay:.41s;}
@keyframes popIn{
  from{opacity:0;transform:translateY(14px) scale(.9);}
  to  {opacity:1;transform:translateY(0) scale(1);}
}
.res-grid span{
  display:block;
  font-size:20px;
  font-weight:750;
  letter-spacing:-.03em;
  color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.res-grid label{
  display:block;
  font-size:9px;
  font-weight:750;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--ink4);
  margin-top:5px;
}

.chart{
  display:flex;
  align-items:flex-end;
  gap:3px;
  height:82px;
  padding:0 2px;
  margin-bottom:16px;
  border-bottom:1px solid var(--line);
}
.chart-bar{
  flex:1 1 0;
  min-width:2px;
  height:0%;
  border-radius:4px 4px 2px 2px;
  background:linear-gradient(180deg,var(--accent2),var(--accent));
  box-shadow:0 0 8px rgba(91,124,250,.35);
  transition:height .6s var(--bounce);
}

.verdict{
  text-align:center;
  font-size:13px;
  font-weight:600;
  color:var(--ink2);
  padding:12px 16px;
  border-radius:14px;
  background:linear-gradient(180deg,#f4f7fc,#eaeff8);
  box-shadow:inset 0 2px 8px rgba(150,168,196,.15);
  animation:popIn .5s .5s var(--bounce) both;
}

.res-actions{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-top:16px;
}

/* ============================================================
   5. RESPONSIVE
   ============================================================ */
@media (max-width:820px){
  .app{padding:16px 12px 52px;}
  .card{padding:18px 16px 22px;}
  :root{--lh:40px;--caret-h:23px;}
  .text-inner{font-size:17px;}
  .viewport{height:calc(var(--lh) * 3 + 22px);padding:11px 12px;}
  .key{height:34px;font-size:9.5px;border-radius:7px;}
  .kb-row{gap:4px;margin-bottom:4px;}
  .keyboard{padding:10px;}
  .stats{grid-template-columns:repeat(2,1fr);}
  .stat .value{font-size:19px;}
  .big-value{font-size:60px;}
  .res-grid{grid-template-columns:repeat(2,1fr);}
  .brand p{display:none;}
}

@media (max-width:520px){
  .time-btn{padding:8px 11px;font-size:11px;}
  .ad-top,.ad-mid{height:72px;}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
}
</style>
</head>

<body>

<!-- ================= AMBIENT BACKGROUND ================= -->
<div class="float-layer" id="floatLayer" aria-hidden="true"></div>

<!-- ===================== APP ===================== -->
<div class="app">

  <!-- top bar -->
  <header class="topbar">
    <div class="brand">
      <div class="logo">⌨</div>
      <div>
        <h1>Typing Speed Test</h1>
        <p>Measure &amp; improve your typing speed</p>
      </div>
    </div>
    <div class="best-badge" id="bestBadge">Best&nbsp;·&nbsp;<b>—</b> WPM</div>
  </header>

  <!-- AD SLOT 1 : top leaderboard -->
  <div class="ad-slot ad-top" data-ad-slot="top">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9317887278098579"
     crossorigin="anonymous"></script>
  </div>

  <!-- ============ TEST CARD ============ -->
  <main class="card">

    <div class="controls">
      <div class="times" id="times"></div>
      <button class="btn" id="restartBtn" type="button">↻ Restart</button>
    </div>

    <div class="stats">
      <div class="stat"><span class="label">Time</span><span class="value" id="statTime">60</span></div>
      <div class="stat"><span class="label">WPM</span><span class="value" id="statWpm">0</span></div>

<script>
/* ================================================================
   1. LOCAL FALLBACK TEXT CORPUS
   (used if the internet request fails or is blocked)
   ================================================================ */
const LOCAL_PARAGRAPHS = [
  "The quick brown fox jumps over the lazy dog while the evening sun settles behind the quiet hills. Typing well is less about raw speed and more about rhythm, so relax your shoulders and let your fingers find a steady pace.",
  "Technology changes quickly, but the habits of clear thinking stay the same. A careful writer learns to listen, to pause, and to choose the simplest word that carries the right meaning.",
  "Morning light filled the small kitchen as the kettle began to hum. She poured a cup of tea, opened her notebook, and wrote down three things she wanted to finish before noon.",
  "Deep in the forest a narrow path wound between tall pines. The air smelled of rain and moss, and every step made a soft sound that seemed to belong to the place itself.",
  "Practice does not make perfect on its own; deliberate practice does. Focus on the letters you keep missing, slow down for a moment, and let accuracy arrive before speed.",
  "The library was almost empty that afternoon. Dust drifted through the tall windows, and the only sound was the gentle turning of pages from a reader in the far corner.",
  "A good keyboard feels like an extension of your hands. When your posture is comfortable and your wrists are relaxed, the words begin to appear without much conscious effort at all.",
  "Small improvements compound over time. Ten focused minutes each day will take you further than a single long session followed by a week of silence and forgotten habits.",
  "The train moved through the valley as clouds gathered above the ridge. Passengers watched the fields slide past, each lost in a private thought about where they were going.",
  "Clear writing is a kindness to the reader. Short sentences carry weight, paragraphs give the mind room to rest, and a well placed detail can make an ordinary scene feel alive.",
  "Scientists often say that the best experiment is the one that surprises you. A result you did not expect is not a failure; it is a door that has just opened onto a new question.",
  "Music filled the hall as the orchestra tuned their instruments. A single note from the oboe cut through the noise, and silence settled over the rows of waiting listeners.",
  "The old map showed a river that no longer existed. He traced it with one finger, wondering how many towns had been built on ground that the water had long since abandoned.",
  "Good software disappears. You stop noticing the buttons, the menus, and the little delays, because everything simply responds the way your hand expected it to respond.",
  "Rain tapped against the window in a slow uneven rhythm. He turned another page, drank the last of his coffee, and decided that the afternoon could wait a little longer.",
  "Every craft has its quiet fundamentals. For a typist those fundamentals are posture, the home row, and the patience to stop and correct a mistake before it becomes a habit.",
  "The market opened early and the streets filled with the smell of bread and roasted nuts. Vendors called out prices while bicycles wove between the slow moving crowd.",
  "A clear sky at night reveals more stars than most people ever notice. Stand still for a few minutes, let your eyes adjust, and the darkness slowly begins to fill with light."
];

const KEYWORDS = [
  "speed","focus","rhythm","flow","accuracy","practice","keyboard","typing",
  "precision","momentum","skill","patience","consistency","muscle memory",
  "words per minute","timing","control","steady","improve","mastery",
  "home row","dexterity","reflex","cadence","discipline","confidence"
];

const TIME_OPTIONS = [
  { label:"1 min",  seconds:60   },
  { label:"2 min",  seconds:120  },
  { label:"3 min",  seconds:180  },
  { label:"5 min",  seconds:300  },
  { label:"8 min",  seconds:480  },
  { label:"10 min", seconds:600  }
];

/* ================================================================
   2. DOM REFERENCES
   ================================================================ */
const textInner   = document.getElementById('textInner');
const caret       = document.getElementById('caret');
const viewport    = document.getElementById('viewport');
const keyboardEl  = document.getElementById('keyboard');
const timesEl     = document.getElementById('times');
const hintEl      = document.getElementById('hint');
const overlay     = document.getElementById('overlay');
const progressBar = document.getElementById('progressBar');
const bestBadge   = document.getElementById('bestBadge');

const statTime = document.getElementById('statTime');
const statWpm  = document.getElementById('statWpm');
const statAcc  = document.getElementById('statAcc');
const statErr  = document.getElementById('statErr');

const rWpm    = document.getElementById('rWpm');
const rAcc    = document.getElementById('rAcc');
const rErr    = document.getElementById('rErr');
const rChars  = document.getElementById('rChars');
const rTime   = document.getElementById('rTime');
const chart   = document.getElementById('chart');
const verdict = document.getElementById('verdict');

/* ================================================================
   3. AMBIENT BACKGROUND (floating keywords + orbs)
   ================================================================ */
(function buildBackground(){
  const layer = document.getElementById('floatLayer');

  const orbColors = [
    'rgba(140,170,255,.55)',
    'rgba(190,205,235,.65)',
    'rgba(160,200,230,.50)',
    'rgba(200,190,240,.45)'
  ];
  for (let i = 0; i < 5; i++){
    const o = document.createElement('div');
    o.className = 'orb';
    const size = 180 + Math.random() * 260;
    o.style.width  = size + 'px';
    o.style.height = size + 'px';
    o.style.left   = (Math.random() * 100) + '%';
    o.style.top    = (Math.random() * 100) + '%';
    o.style.background = orbColors[i % orbColors.length];
    o.style.animationDuration = (14 + Math.random() * 14) + 's';
    o.style.animationDelay = (-Math.random() * 12) + 's';
    layer.appendChild(o);
  }

  const count = window.innerWidth < 700 ? 14 : 24;
  for (let i = 0; i < count; i++){
    const w = document.createElement('div');
    w.className = 'float-word';
    w.textContent = KEYWORDS[Math.floor(Math.random() * KEYWORDS.length)];
    w.style.left     = (Math.random() * 94) + '%';
    w.style.top      = (Math.random() * 100) + '%';
    w.style.fontSize = (13 + Math.random() * 30) + 'px';
    w.style.setProperty('--rot', (Math.random() * 16 - 8).toFixed(1) + 'deg');
    w.style.setProperty('--drift', (Math.random() * 120 - 60).toFixed(0) + 'px');
    w.style.animationDuration = (20 + Math.random() * 26) + 's';
    w.style.animationDelay    = (-Math.random() * 40) + 's';
    layer.appendChild(w);
  }
})();

/* Pause the whole ambience while the user is actively typing */
let idleTimer = null;
function pauseAmbience(){
  document.body.classList.add('typing');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.remove('typing'), 1400);
}

/* ================================================================
   4. ANIMATED KEYBOARD — build
   ================================================================ */
const KEY_ROWS = [
  [
    {k:'`', l:'`'}, {k:'1'}, {k:'2'}, {k:'3'}, {k:'4'}, {k:'5'},
    {k:'6'}, {k:'7'}, {k:'8'}, {k:'9'}, {k:'0'},
    {k:'-', l:'−'}, {k:'=', l:'='},
    {k:'backspace', l:'⌫ Backspace', w:2, mod:true}
  ],
  [
    {k:'tab', l:'Tab', w:1.5, mod:true},
    {k:'q'},{k:'w'},{k:'e'},{k:'r'},{k:'t'},{k:'y'},{k:'u'},{k:'i'},{k:'o'},{k:'p'},
    {k:'[', l:'['}, {k:']', l:']'},
    {k:'\\', l:'\\', w:1.5, mod:true}
  ],
  [
    {k:'caps', l:'Caps', w:1.75, mod:true},
    {k:'a'},{k:'s'},{k:'d'},{k:'f'},{k:'g'},{k:'h'},{k:'j'},{k:'k'},{k:'l'},
    {k:';', l:';'}, {k:"'", l:"'"},
    {k:'enter', l:'Enter ⏎', w:2.25, mod:true}
  ],
  [
    {k:'shift', l:'Shift', w:2.25, mod:true},
    {k:'z'},{k:'x'},{k:'c'},{k:'v'},{k:'b'},{k:'n'},{k:'m'},
    {k:',', l:','}, {k:'.', l:'.'}, {k:'/', l:'/'},
    {k:'shift', l:'Shift', w:2.75, mod:true}
  ],
  [
    {k:'ctrl', l:'Ctrl', w:1.25, mod:true},
    {k:'alt',  l:'Alt',  w:1.25, mod:true},
    {k:'space', l:'',    w:10,   mod:true},
    {k:'alt',  l:'Alt',  w:1.25, mod:true},
    {k:'ctrl', l:'Ctrl', w:1.25, mod:true}
  ]
];

(function buildKeyboard(){
  KEY_ROWS.forEach(row => {
    const rowEl = document.createElement('div');
    rowEl.className = 'kb-row';
    row.forEach(key => {
      const el = document.createElement('div');
      el.className = 'key' + (key.mod ? ' mod' : '');
      el.dataset.key = key.k;
      el.style.flexGrow = String(key.w || 1);
      el.textContent = (key.l !== undefined) ? key.l : key.k.toUpperCase();
      rowEl.appendChild(el);
    });
    keyboardEl.appendChild(rowEl);
  });
})();

function setKeyActive(id, on){
  if (!id) return;
  const keys = keyboardEl.querySelectorAll('.key');
  for (let i = 0; i < keys.length; i++){
    if (keys[i].dataset.key === id) keys[i].classList.toggle('active', on);
  }
}

function keyIdFromEvent(e){
  const k = e.key;
  if (k === ' ')         return 'space';
  if (k === 'Backspace') return 'backspace';
  if (k === 'Enter')     return 'enter';
  if (k === 'Tab')       return 'tab';
  if (k === 'CapsLock')  return 'caps';
  if (k === 'Shift')     return 'shift';
  if (k === 'Control')   return 'ctrl';
  if (k === 'Alt')       return 'alt';
  if (k.length === 1)    return k.toLowerCase();
  return null;
}

/* ================================================================
   5. TEST STATE
   ================================================================ */
let chars = [];       // every <span class="ch">
let fullText = '';    // the whole text loaded so far
let state = {};
let fetchToken = 0;   // guards against out-of-order network replies

function freshState(seconds){
  return {
    totalTime: seconds,
    timeLeft: seconds,
    index: 0,
    result: [],        // index -> true / false / undefined
    started: false,
    running: false,
    finished: false,
    startTime: 0,
    timerId: null,
    samples: []
  };
}

/* ================================================================
   6. REMOTE PARAGRAPH FETCHING (with graceful fallback)
   ================================================================ */
function sanitize(text){
  return String(text)
    .replace(/[\u2018\u2019\u02BC]/g, "'")
    .replace(/[\u201C\u201D]/g, '"')
    .replace(/[\u2013\u2014]/g, '-')
    .replace(/\u2026/g, '...')
    .replace(/[^\x20-\x7E\n]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function withTimeout(promise, ms){
  return new Promise((resolve, reject) => {
    const t = setTimeout(() => reject(new Error('timeout')), ms);
    promise.then(
      v => { clearTimeout(t); resolve(v); },
      e => { clearTimeout(t); reject(e); }
    );
  });
}

async function tryFetchRemote(){
  const sources = [
    async () => {
      const r = await fetch('https://api.quotable.io/random?maxLength=380');
      if (!r.ok) throw new Error('bad');
      const d = await r.json();
      return d.content;
    },
    async () => {
      const r = await fetch('https://dummyjson.com/quotes/random');
      if (!r.ok) throw new Error('bad');
      const d = await r.json();
      return d.quote;
    },
    async () => {
      const r = await fetch('https://baconipsum.com/api/?type=meat-and-filler&sentences=5&format=text');
      if (!r.ok) throw new Error('bad');
      return await r.text();
    }
  ];

  for (let i = 0; i < sources.length; i++){
    try {
      const raw = await withTimeout(sources[i](), 4500);
      const clean = sanitize(raw);
      if (clean && clean.length >= 90) return clean;
    } catch (err) { /* try next source */ }
  }
  return null;
}

function pickLocal(){
  return LOCAL_PARAGRAPHS[Math.floor(Math.random() * LOCAL_PARAGRAPHS.length)];
}

/* Load a local paragraph instantly, then swap in an online one
   if it arrives before the user has started typing. */
async function loadParagraph(){
  const token = ++fetchToken;
  loadText(pickLocal());

  const remote = await tryFetchRemote();
  if (remote && token === fetchToken && !state.started){
    loadText(remote);
  }
}

/* ================================================================
   7. TEXT RENDERING
   ================================================================ */
function addWordEl(word, trailingSpace){
  const wEl = document.createElement('span');
  wEl.className = 'word';

  for (let i = 0; i < word.length; i++){
    const s = document.createElement('span');
    s.className = 'ch';
    s.textContent = word[i];
    wEl.appendChild(s);
    chars.push(s);
  }
  if (trailingSpace){
    const s = document.createElement('span');
    s.className = 'ch';
    s.textContent = ' ';
    wEl.appendChild(s);
    chars.push(s);
  }
  textInner.appendChild(wEl);
}

function loadText(paragraph){
  textInner.querySelectorAll('.word').forEach(n => n.remove());
  chars = [];
  fullText = paragraph;

  const words = paragraph.split(' ');
  words.forEach((w, i) => addWordEl(w, i < words.length - 1));

  state.index = 0;
  state.result = [];
  textInner.style.transform = 'translateY(0px)';
  updateCaret();
}

function appendText(paragraph){
  const words = textInner.querySelectorAll('.word');
  const last = words[words.length - 1];
  if (last){
    const s = document.createElement('span');
    s.className = 'ch';
    s.textContent = ' ';
    last.appendChild(s);
    chars.push(s);
  }
  const parts = paragraph.split(' ');
  parts.forEach((w, i) => addWordEl(w, i < parts.length - 1));
  fullText += ' ' + paragraph;
}

/* ================================================================
   8. CARET + SCROLLING
   ================================================================ */
function readLineHeight(){
  const v = getComputedStyle(document.documentElement).getPropertyValue('--lh');
  return parseFloat(v) || 46;
}

function updateCaret(){
  const el = chars[state.index];
  if (!el){
    caret.style.opacity = '0';
    return;
  }
  caret.style.opacity = '1';

  const LH = readLineHeight();
  const caretH = parseFloat(
    getComputedStyle(document.documentElement).getPropertyValue('--caret-h')
  ) || 26;

  const line = Math.max(0, Math.round(el.offsetTop / LH));
  const x = el.offsetLeft;
  const y = line * LH + Math.round((LH - caretH) / 2);

  caret.style.transform = 'translate(' + x + 'px,' + y + 'px)';
  textInner.style.transform = 'translateY(' + (-line * LH) + 'px)';
}

/* ================================================================
   9. LIVE STATS
   ================================================================ */
function computeStats(){
  let correct = 0, typed = 0;
  for (let i = 0; i < state.result.length; i++){
    if (state.result[i] === true){ correct++; typed++; }
    else if (state.result[i] === false){ typed++; }
  }

  const elapsed = state.running
      ? Math.max(0.6, (performance.now() - state.startTime) / 1000)
      : Math.max(0.6, state.totalTime - state.timeLeft);

  const minutes = elapsed / 60;
  const wpm = Math.max(0, Math.round((correct / 5) / minutes));
  const acc = typed > 0 ? Math.round((correct / typed) * 100) : 100;
  const errors = typed - correct;

  return { correct, typed, wpm, acc, errors, elapsed };
}

function refreshLiveStats(){
  const s = computeStats();
  statWpm.textContent = s.wpm;
  statAcc.textContent = s.acc + '%';
  statErr.textContent = s.errors;

  const pct = (state.timeLeft / state.totalTime) * 100;
  progressBar.style.width = pct + '%';
  progressBar.classList.toggle('low', pct < 30);
}

function pulse(el){
  el.classList.remove('pulse');
  void el.offsetWidth;
  el.classList.add('pulse');
}

/* ================================================================
   10. TIMER
   ================================================================ */
function tick(){
  const elapsed = (performance.now() - state.startTime) / 1000;
  state.timeLeft = Math.max(0, state.totalTime - elapsed);

  statTime.textContent = Math.ceil(state.timeLeft);

  const sec = Math.floor(elapsed);
  while (state.samples.length < sec && state.samples.length < state.totalTime){
    state.samples.push(computeStats().wpm);
  }

  refreshLiveStats();

  if (state.timeLeft <= 0) finishTest();
}

/* ================================================================
   11. START / FINISH / RESET
   ================================================================ */
function startTest(){
  state.started = true;
  state.running = true;
  state.startTime = performance.now();
  state.timerId = setInterval(tick, 100);
  hintEl.style.opacity = '0';
  document.body.classList.add('typing');
}

function finishTest(){
  if (state.finished) return;
  state.finished = true;
  state.running = false;
  clearInterval(state.timerId);
  document.body.classList.remove('typing');
  showResults();
}

function resetTest(seconds){
  clearInterval(state.timerId);
  const total = (seconds !== undefined) ? seconds : state.totalTime;

  state = freshState(total);
  fetchToken++;                 // cancel any pending remote swap

  loadParagraph();              // local now, online if it arrives fast

  statTime.textContent = Math.ceil(total);
  statWpm.textContent  = '0';
  statAcc.textContent  = '100%';
  statErr.textContent  = '0';
  progressBar.style.width = '100%';
  progressBar.classList.remove('low');
  hintEl.style.opacity = '1';
  hintEl.textContent = 'Start typing to begin the test…';
  overlay.classList.remove('show');
  document.body.classList.remove('typing');

  setTimeout(updateCaret, 30);
}

/* ================================================================
   12. TYPING HANDLER
   ================================================================ */
function handleTyping(e){
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (state.finished) return;

  pauseAmbience();

  /* ---------- BACKSPACE ---------- */
  if (e.key === 'Backspace'){
    e.preventDefault();
    if (state.index > 0){
      state.index--;
      state.result[state.index] = undefined;
      const el = chars[state.index];
      if (el) el.classList.remove('correct', 'wrong');
      updateCaret();
      refreshLiveStats();
    }
    return;
  }

  /* ---------- PRINTABLE CHARACTERS ---------- */
  if (e.key.length !== 1) return;
  e.preventDefault();

  if (!state.started) startTest();

  // keep a healthy buffer of text ahead of the typist
  if (state.index >= chars.length - 60){
    appendText(pickLocal());
  }

  const el = chars[state.index];
  if (!el) return;

  const correct = e.key === el.textContent;
  state.result[state.index] = correct;

  el.classList.remove('correct', 'wrong');
  el.classList.add(correct ? 'correct' : 'wrong');

  if (correct) pulse(statWpm);

  state.index++;
  updateCaret();
  refreshLiveStats();
}

document.addEventListener('keydown', function(e){
  const id = keyIdFromEvent(e);
  setKeyActive(id, true);

  if (overlay.classList.contains('show')){
    if (e.key === 'Escape') closeResults();
    return;
  }
  handleTyping(e);
});

document.addEventListener('keyup', function(e){
  setKeyActive(keyIdFromEvent(e), false);
});

/* stop the page from scrolling when space is pressed */
window.addEventListener('keydown', function(e){
  if (e.key === ' ' && e.target === document.body) e.preventDefault();
}, { passive:false });

/* ================================================================
   13. RESULT SCOREBOARD (animated)
   ================================================================ */
function animateNumber(el, to, duration, suffix){
  suffix = suffix || '';
  const start = performance.now();
  function frame(t){
    const p = Math.min(1, (t - start) / duration);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(to * eased) + suffix;
    if (p < 1) requestAnimationFrame(frame);
    else el.textContent = to + suffix;
  }
  requestAnimationFrame(frame);
}

function showResults(){
  const s = computeStats();
  const duration = Math.max(1, Math.round(state.totalTime - state.timeLeft));

  animateNumber(rWpm, s.wpm, 1100);

  setTimeout(() => animateNumber(rAcc,   s.acc,     800, '%'), 200);
  setTimeout(() => animateNumber(rErr,   s.errors,  700),      330);
  setTimeout(() => animateNumber(rChars, s.correct, 900),      450);
  setTimeout(() => animateNumber(rTime,  duration,  800, 's'), 570);

  let msg = 'Keep going — rhythm comes with practice.';
  if (s.wpm >= 20 && s.wpm < 40)  msg = 'Solid start. Focus on accuracy before speed.';
  if (s.wpm >= 40 && s.wpm < 60)  msg = 'Good pace — you are above average!';
  if (s.wpm >= 60 && s.wpm < 80)  msg = 'Fast and steady. Nicely done.';
  if (s.wpm >= 80 && s.wpm < 100) msg = 'Excellent! That is professional speed.';
  if (s.wpm >= 100)               msg = 'Blazing fast. Absolutely impressive!';
  if (s.acc < 85 && s.typed > 20) msg = 'Slow down a little — accuracy is what counts.';
  verdict.textContent = msg;

  /* animated bar chart of WPM over time */
  chart.innerHTML = '';
  const samples = state.samples.length ? state.samples.slice() : [s.wpm];
  const maxVal = Math.max.apply(null, samples.concat([1]));

  samples.forEach((v, i) => {
    const bar = document.createElement('div');
    bar.className = 'chart-bar';
    bar.style.height = '0%';
    bar.title = v + ' WPM';
    chart.appendChild(bar);
    setTimeout(() => {
      bar.style.height = Math.max(6, (v / maxVal) * 100) + '%';
    }, 120 + i * 55);
  });

  saveBest(s.wpm);
  overlay.classList.add('show');
}

function closeResults(){
  overlay.classList.remove('show');
}

/* ================================================================
   14. BEST SCORE (localStorage)
   ================================================================ */
function loadBest(){
  try {
    const v = localStorage.getItem('typeflow_best');
    return v ? parseInt(v, 10) : 0;
  } catch (err){ return 0; }
}

function saveBest(wpm){
  try {
    if (wpm > loadBest()) localStorage.setItem('typeflow_best', String(wpm));
  } catch (err){ /* storage unavailable */ }
  renderBest();
}

function renderBest(){
  const best = loadBest();
  bestBadge.innerHTML = 'Best&nbsp;·&nbsp;<b>' + (best || '—') + '</b> WPM';
}

/* ================================================================
   15. TIME SELECTOR BUTTONS
   ================================================================ */
(function buildTimeButtons(){
  TIME_OPTIONS.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'time-btn' + (i === 0 ? ' active' : '');
    btn.textContent = opt.label;
    btn.dataset.seconds = opt.seconds;

    btn.addEventListener('click', () => {
      timesEl.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      resetTest(opt.seconds);
    });

    timesEl.appendChild(btn);
  });
})();

/* ================================================================
   16. UI EVENTS
   ================================================================ */
document.getElementById('restartBtn').addEventListener('click', () => {
  resetTest(state.totalTime);
});

document.getElementById('againBtn').addEventListener('click', () => {
  resetTest(state.totalTime);
});

document.getElementById('closeBtn').addEventListener('click', closeResults);

overlay.addEventListener('click', (e) => {
  if (e.target === overlay) closeResults();
});

viewport.addEventListener('click', () => {
  caret.style.animation = 'none';
  void caret.offsetWidth;
  caret.style.animation = '';
});

window.addEventListener('resize', updateCaret);

/* ================================================================
   17. BOOT
   ================================================================ */
renderBest();
state = freshState(TIME_OPTIONS[0].seconds);
loadParagraph();
statTime.textContent = TIME_OPTIONS[0].seconds;
refreshLiveStats();

if (document.fonts && document.fonts.ready){
  document.fonts.ready.then(updateCaret);
}
window.addEventListener('load', () => setTimeout(updateCaret, 60));
</script>
</body>
</html>
